name: Ringify
options:
  bundleIdPrefix: com.ringify
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: tr
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
packages:
  RingifyCore:
    path: ../packages/RingifyCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
targets:
  Ringify:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Ringify
        excludes:
          - Resources
          - Supporting/Info.plist
      - path: Ringify/Resources
        buildPhase: resources
        excludes:
          - Ringify.storekit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ringify.app
        PRODUCT_NAME: Ringify
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Ringify/Supporting/Info.plist
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: RingifyCore
  RingifyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RingifyTests
      - path: Ringify/Resources/Ringify.storekit
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ringify.app.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Ringify
      - package: RingifyCore
  RingifyUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RingifyUITests
      - path: Ringify/Resources/Ringify.storekit
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ringify.app.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Ringify
schemes:
  Ringify:
    build:
      targets:
        Ringify: all
        RingifyTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Ringify/Resources/Ringify.storekit
    test:
      config: Debug
      targets:
        - name: RingifyTests
          parallelizable: false
    archive:
      config: Release
  RingifyUI:
    build:
      targets:
        Ringify: all
        RingifyTests: [test]
        RingifyUITests: [test]
    test:
      config: Debug
      macroExpansion: Ringify
      targets:
        - name: RingifyTests
          parallelizable: false
        - name: RingifyUITests
          parallelizable: false
