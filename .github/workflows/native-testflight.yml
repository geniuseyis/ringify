name: TestFlight upload (manual)

# Archives a signed Release build and uploads it to App Store Connect for
# TestFlight. Signing is automatic: Xcode creates or reuses the distribution
# certificate and profile through the App Store Connect API key.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID      App Store Connect API key ID
#   ASC_ISSUER_ID   App Store Connect API issuer ID
#   ASC_KEY_P8      Full contents of the downloaded AuthKey_<ID>.p8 file
#   APPLE_TEAM_ID   Apple Developer team ID
# Optional repository variable:
#   APP_BUNDLE_ID   Overrides com.ringify.app if that bundle ID is unavailable

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      BUNDLE_ID: ${{ vars.APP_BUNDLE_ID || 'com.ringify.app' }}
      BUILD_NUMBER: ${{ github.run_number }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check required secrets
        shell: bash
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              printf '::error::Missing repository secret %s\n' "$name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified 2026-11-04
        with:
          persist-credentials: false

      - name: Prepare verified XcodeGen for this temporary runner
        shell: bash
        env:
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/ringify-xcodegen-2.46.0"
          mkdir -p "$tools"
          curl --fail --location --retry 2 --max-time 120 \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip \
            --output "$tools/xcodegen.zip"
          printf '%s  %s\n' "$XCODEGEN_SHA256" "$tools/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$tools/xcodegen.zip" -d "$tools/unpacked"
          binary="$(find "$tools/unpacked" -type f -name xcodegen -print | sed -n '1p')"
          test -n "$binary" && test -x "$binary"
          dirname "$binary" >> "$GITHUB_PATH"

      - name: Write the App Store Connect API key
        shell: bash
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          printf 'ASC_KEY_PATH=%s\n' "$key" >> "$GITHUB_ENV"

      - name: Archive with automatic signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          xcodebuild -version | tee artifacts/xcode.txt
          (cd ios && xcodegen generate --spec project.yml) 2>&1 | tee artifacts/xcodegen.log
          xcodebuild -project ios/Ringify.xcodeproj -scheme Ringify -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Ringify.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/RingifyDerivedData" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive 2>&1 | tee artifacts/archive.log

      - name: Export and upload to App Store Connect
        shell: bash
        run: |
          set -euo pipefail
          options="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$options" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Ringify.xcarchive" \
            -exportOptionsPlist "$options" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee artifacts/upload.log

      - name: Remove the API key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: testflight-logs-${{ github.run_id }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn

      - name: Summary
        if: success()
        shell: bash
        run: |
          printf '%s\n' \
            '## Ringify TestFlight upload' \
            "Build $BUILD_NUMBER for $BUNDLE_ID was uploaded to App Store Connect." \
            'Processing usually takes 10–30 minutes; the build then appears in TestFlight for internal testers.' \
            >> "$GITHUB_STEP_SUMMARY"
